[build]
  command = "npm run netlify-build"
  publish = ".next"

[build.environment]
  # Ensure Prisma generates binaries correctly
  PRISMA_BINARY_TARGET = "debian-openssl-3.0.x"
  PRISMA_SKIP_POSTINSTALL_GENERATE = "false"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  # Add Vertex AI logging
  NODE_ENV = "production"
  DEBUG = "vertex-ai:*,prisma:*"

[functions]
  # Increase build time if needed for the test
  node_bundler = "esbuild"
  external_node_modules = ["@google-cloud/vertexai", "@prisma/client", "prisma"]

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# Handle redirects for app subdomain
[[redirects]]
  from = "/*"
  to = "/app/:splat"
  status = 200
  force = true
  conditions = {host = "app.neatpeek.netlify.app"}

# Fallback for 404 pages
[[redirects]]
  from = "/*"
  to = "/404"
  status = 404
