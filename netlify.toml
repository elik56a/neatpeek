[build]
  command = "npm run netlify-build"
  publish = ".next"

[build.environment]
  # Skip Prisma binary download during build
  PRISMA_SKIP_POSTINSTALL_GENERATE = "false"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

# Handle redirects for app subdomain
[[redirects]]
  from = "/*"
  to = "/app/:splat"
  status = 200
  force = true
  conditions = {host = "app.neatpeak.netlify.app"}

# Fallback for 404 pages
[[redirects]]
  from = "/*"
  to = "/404"
  status = 404
